[project]
name = "expectativa-de-vida"
version = "0.1.0"
requires-python = ">=3.12.10"
dependencies = [
    "duckdb>=2.0.0",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "taskipy>=1.14.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.taskipy.tasks]
lint = "ruff check ."
format = "ruff format . && ruff check --select I --fix ."
test = "pytest ./tests/ -v --cov=pipeline --cov-report=term-missing"
